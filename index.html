<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <h1>MY TASK LIST</h1>
      <h2 id="status">SYSTEM READY</h2>

      <div id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="O que vamos fazer hoje?"
        />

        <button onclick="addTask()">Adicionar</button>
      </div>
      <div id="taskHeader">
        <h2>Task</h2>
        <h2>Complete</h2>
        <h2>.POP</h2>
      </div>

      <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
